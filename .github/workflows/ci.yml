name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    env:
      # The Electron end-to-end test skips itself when the binary is absent.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  package:
    name: package and install
    needs: test
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pack the CLI as it would be published
        run: npm pack -w mcp-forge --pack-destination "$RUNNER_TEMP"
      - name: Install the tarball into a clean prefix
        run: npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/mcp-forge-*.tgz
      - name: Run the installed CLI
        run: |
          export PATH="$RUNNER_TEMP/prefix/bin:$PATH"
          mcp-forge --help
          mcp-forge doctor --target api cli
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-forge-package
          path: ${{ runner.temp }}/mcp-forge-*.tgz
